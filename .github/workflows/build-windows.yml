name: Build ALLY - 1300 SUB SYNTH – Windows VST3 Installer

on:
  push:
    branches: [ main ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── 2. Setup Ninja & MSVC ──────────────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ── 3. Configure CMake with Ninja ──────────────────────────────────────
      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      # ── 4. Build ───────────────────────────────────────────────────────────
      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel

      # ── 5. Run automated regression tests (DSP, MIDI, APVTS, UI) ───────────
      - name: Run automated regression tests
        shell: cmd
        run: ctest --test-dir build --output-on-failure -C Release

      # ── 6. Locate the built VST3 ──────────────────────────────────────────
      - name: Find VST3 artefact
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Filter "ALLY - 1300 SUB SYNTH.vst3" build | Select-Object -First 1
          if (-not $vst3) { Write-Error "VST3 not found!"; exit 1 }
          Write-Output "VST3_PATH=$($vst3.FullName)" | Out-File $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "Found: $($vst3.FullName)"

      # ── 7. Validate VST3 host compatibility with pluginval ─────────────────
      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          $valUrl = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          $expectedHash = "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"
          Invoke-WebRequest -Uri $valUrl -OutFile "pluginval_Windows.zip"
          $actualHash = (Get-FileHash -Path "pluginval_Windows.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "pluginval checksum mismatch! Expected: $expectedHash, Actual: $actualHash"
          }
          Expand-Archive -Path "pluginval_Windows.zip" -DestinationPath "pluginval_bin" -Force
          $valArgs = "--headless --validate-in-process --strictness-level 5 --validate `"$Env:VST3_PATH`""
          $p = Start-Process -FilePath "pluginval_bin\pluginval.exe" -ArgumentList $valArgs -Wait -PassThru -NoNewWindow
          Write-Output "pluginval finished with exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            throw "pluginval validation failed with exit code $($p.ExitCode)"
          }

      # ── 8. Copy VST3 to staging folder ───────────────────────────────────
      - name: Stage VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\staging
          Copy-Item -Recurse -Force "$Env:VST3_PATH" -Destination installer\staging\
          Get-ChildItem -Recurse installer\staging

      # ── 9. Install Inno Setup ─────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # ── 10. Compile Inno Setup installer ──────────────────────────────────
      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\AllyBass-Windows.iss

      # ── 11. Upload installer as artifact ─────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLY-1300-SUB-SYNTH-Windows-Installer
          path: installer\Output\AllyBass_Setup.exe
          retention-days: 30

      # ── 12. Attach to GitHub Release (only on tag push) ──────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Output\AllyBass_Setup.exe
