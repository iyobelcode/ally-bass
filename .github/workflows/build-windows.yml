name: Build ALLY BASS – Windows VST3 Installer

on:
  push:
    branches: [ main ]
    tags:    [ 'v*' ]
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── 2. Setup Ninja & MSVC ──────────────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ── 3. Configure CMake with Ninja ──────────────────────────────────────
      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      # ── 4. Build ───────────────────────────────────────────────────────────
      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel

      # ── 5. Locate the built VST3 ──────────────────────────────────────────
      - name: Find VST3 artefact
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Filter "ALLY - 1300 SUB SYNTH.vst3" build | Select-Object -First 1
          if (-not $vst3) { Write-Error "VST3 not found!"; exit 1 }
          Write-Output "VST3_PATH=$($vst3.FullName)" | Out-File $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "Found: $($vst3.FullName)"

      # ── 6. Copy VST3 to staging folder ───────────────────────────────────
      - name: Stage VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\staging
          Copy-Item -Recurse -Force "$Env:VST3_PATH" -Destination installer\staging\
          Get-ChildItem -Recurse installer\staging

      # ── 7. Install Inno Setup ─────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # ── 8. Compile Inno Setup installer ───────────────────────────────────
      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\AllyBass-Windows.iss

      # ── 9. Upload installer as artifact ──────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLY-BASS-Windows-Installer
          path: installer\Output\AllyBass_Setup.exe
          retention-days: 30

      # ── 10. Attach to GitHub Release (only on tag push) ───────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Output\AllyBass_Setup.exe
